[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "balelink"
version = "0.1.0"
description = "Log in to Bale (بله) with a personal account; send and receive messages. Unofficial."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{ name = "Pedram Khademi", email = "pedramkhademi619@gmail.com" }]
keywords = ["bale", "bale.ai", "messenger", "userbot", "client", "بله"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
  "Typing :: Typed",
]
dependencies = ["aiobale-py>=0.3.10"]

[project.optional-dependencies]
gateway = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.26"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.26"]

[project.urls]
Homepage = "https://github.com/pedramkhademi619/balelink"
Documentation = "https://github.com/pedramkhademi619/balelink/tree/main/docs"
Issues = "https://github.com/pedramkhademi619/balelink/issues"
Changelog = "https://github.com/pedramkhademi619/balelink/blob/main/CHANGELOG.md"

[project.scripts]
balelink = "balelink.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["balelink"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Newer ruff also formats code blocks inside Markdown; the docs favour readable one-liners.
extend-exclude = ["*.md"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]
